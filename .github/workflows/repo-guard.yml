# Every push and pull request: no game data, RE output, large files, signing
# keys or personal paths (.github/scripts/repo_guard.py), and no secrets (gitleaks).
name: repo guard

on:
  push:
    branches: [develop, main]  # other branches build through their pull request
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # gitleaks lists the PR's commits

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Files
        run: python3 .github/scripts/repo_guard.py
      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
