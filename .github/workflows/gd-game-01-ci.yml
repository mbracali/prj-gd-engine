# Builds gd-game-01 on pull requests and pushes that touch it.
# macOS runs only on develop/main, by hand, or on a PR labelled "ci:macos"
# (macOS minutes count 10x while the repo is private).
name: gd-game-01 CI

on:
  push:
    branches: [develop, main]  # other branches build through their pull request
    paths: ["gd-game-01/**", ".github/workflows/gd-game-01-*.yml"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ["gd-game-01/**", ".github/workflows/gd-game-01-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gd-game-01-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/gd-game-01-build.yml
    with:
      version: ci-${{ github.sha }}
      macos: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
