name: Feature
description: A new feature or an enhanced (PC-only) option.
labels: [feature]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [Guitar Hero 1, Guitar Hero 2, Guitar Hero 80s, Rock Band 1, Game Launcher]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
