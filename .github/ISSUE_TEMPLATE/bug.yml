name: Bug
description: Something crashes, breaks or behaves wrongly.
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [Guitar Hero 1, Guitar Hero 2, Guitar Hero 80s, Rock Band 1, Game Launcher]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      options: [Windows, macOS, Linux, Steam Deck, Android]
      placeholder: "Windows"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Career > Easy > Tier 1 > I Love Rock 'n Roll ..."
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: Never attach game files or parts of your disc image.
