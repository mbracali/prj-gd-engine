// The Guitar Dream Universal Launcher's Android build (scripts/build.sh
// android runs it). Based on SDL3's android-project template, like
// gd-game-02/engine/android; the native code is ../CMakeLists.txt.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
